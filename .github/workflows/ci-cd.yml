name: MedBook CI/CD Pipeline

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  TZ: Asia/Almaty

jobs:
  # =========================================================================
  # ЭТАП 1: Проверка качества и стиля программного кода (Lint & Code Quality)
  # =========================================================================
  code-quality:
    name: "1. Code Quality & Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linter and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: python -m compileall -q app mock_service tests

      - name: Run Ruff static code analysis
        run: |
          ruff check app mock_service tests --select E9,F63,F7,F82 --output-format=full
          ruff check app mock_service tests --statistics --exit-zero > lint-report.txt
          cat lint-report.txt

      - name: Upload Code Quality Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: lint-report.txt
          retention-days: 7

  # =========================================================================
  # ЭТАП 2: Автоматическая сборка приложения и формирование артефакта сборки
  # =========================================================================
  build:
    name: "2. Build Docker Images & Artifacts"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env configuration
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build medbook-backend and mock-gateway Docker images
        run: |
          docker compose build
          docker images | grep medbook

      - name: Generate Build Metadata & Save Docker Image Artifact
        run: |
          mkdir -p build-artifacts
          echo "Build ID: ${{ github.run_id }}" > build-artifacts/build-info.txt
          echo "Commit SHA: ${{ github.sha }}" >> build-artifacts/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-artifacts/build-info.txt
          echo "Timestamp: $(date -Iseconds)" >> build-artifacts/build-info.txt
          docker images --format "{{.Repository}}:{{.Tag}} ({{.Size}})" | grep medbook >> build-artifacts/build-info.txt
          cat build-artifacts/build-info.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medbook-build-artifact-${{ github.run_number }}
          path: build-artifacts/
          retention-days: 7

  # =========================================================================
  # ЭТАП 3: Автоматическое интеграционное тестирование (Pytest 18 Scenarios)
  # =========================================================================
  test:
    name: "3. Automated Tests (Pytest 18 Scenarios)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for Host Test Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Start multi-container test stack (Docker Compose)
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          docker compose up -d --build
          echo "Waiting for backend and mock-gateway to become ready..."
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health > /dev/null && curl -fsS http://localhost:8001/health > /dev/null; then
              echo "All services are up and healthy!"
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Run 18 Integration Tests with Pytest & Generate JUnit XML Report
        env:
          DATABASE_URL: postgresql+psycopg://medbook:medbook@localhost:5433/medbook
          TEST_DATABASE_URL: postgresql+psycopg://medbook:medbook@localhost:5433/medbook
          REDIS_URL: redis://localhost:6380/0
          MOCK_SERVICE_URL: http://localhost:8001
          JWT_SECRET: super-secret-jwt-key-change-in-prod
        run: |
          pytest -v tests/test_api.py --junitxml=pytest-report.xml

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-report-${{ github.run_number }}
          path: pytest-report.xml
          retention-days: 7

      - name: Tear down test environment
        if: always()
        run: docker compose down -v

  # =========================================================================
  # ЭТАП 4: Автоматическое развертывание в тестовую среду (Staging Deploy)
  # =========================================================================
  deploy-staging:
    name: "4. Deploy to Test Environment (Staging)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy MedBook Stack to Staging Environment
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          docker compose up -d --build
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Run Post-Deployment Smoke Checks (Health, Swagger, MD3 UI, Mock Gateway)
        run: |
          echo "=== 1. Checking /health endpoint ==="
          curl -fsS http://localhost:8000/health | tee staging-health.json
          echo ""
          echo "=== 2. Checking OpenAPI / Swagger UI (/docs) ==="
          curl -fsS -I http://localhost:8000/docs | head -n 5
          echo "=== 3. Checking Material Design 3 Web UI (/) ==="
          curl -fsS -I http://localhost:8000/ | head -n 5
          echo "=== 4. Checking Mock Gateway (/health) ==="
          curl -fsS http://localhost:8001/health
          echo ""
          echo "Staging deployment verified successfully!"

      - name: Upload Staging Deployment Log
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-status-${{ github.run_number }}
          path: staging-health.json
          retention-days: 7

      - name: Clean up staging runner
        if: always()
        run: docker compose down -vB: medbook
  JWT_SECRET: ci-super-secret-jwt-key-2026-medbook

jobs:
  # =========================================================================
  # ЭТАП 1: Проверка качества и стиля программного кода (Lint & Code Quality)
  # =========================================================================
  code-quality:
    name: "1. Code Quality & Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linter and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation
        run: python -m compileall -q app mock_service tests

      - name: Run Ruff static code analysis
        run: |
          ruff check app mock_service tests --select E9,F63,F7,F82 --output-format=full
          ruff check app mock_service tests --statistics --exit-zero > lint-report.txt
          cat lint-report.txt

      - name: Upload Code Quality Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: lint-report.txt
          retention-days: 7

  # =========================================================================
  # ЭТАП 2: Автоматическая сборка приложения и формирование артефакта сборки
  # =========================================================================
  build:
    name: "2. Build Docker Images & Artifacts"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build medbook-backend and mock-gateway Docker images
        run: |
          docker compose build --no-cache
          docker images | grep medbook

      - name: Generate Build Metadata & Save Docker Image Artifact
        run: |
          mkdir -p build-artifacts
          echo "Build ID: ${{ github.run_id }}" > build-artifacts/build-info.txt
          echo "Commit SHA: ${{ github.sha }}" >> build-artifacts/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-artifacts/build-info.txt
          echo "Timestamp: $(date -Iseconds)" >> build-artifacts/build-info.txt
          docker save medbook-service-backend:latest medbook-service-mock-gateway:latest | gzip > build-artifacts/medbook-images.tar.gz
          ls -lh build-artifacts/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medbook-build-artifact-${{ github.run_number }}
          path: build-artifacts/
          retention-days: 7

  # =========================================================================
  # ЭТАП 3: Автоматическое интеграционное тестирование (Pytest + Postgres + Redis)
  # =========================================================================
  test:
    name: "3. Automated Tests (Pytest 18 Scenarios)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start multi-container test stack (Docker Compose)
        run: |
          docker compose up -d --build
          echo "Waiting for all 4 services (postgres, redis, mock-gateway, backend) to become healthy..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Backend is up and healthy!"
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Run 18 Integration Tests with Pytest & Generate JUnit XML Report
        run: |
          docker compose exec -T backend pytest -v tests/test_api.py --junitxml=/app/pytest-report.xml
          docker compose cp backend:/app/pytest-report.xml ./pytest-report.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-report-${{ github.run_number }}
          path: pytest-report.xml
          retention-days: 7

      - name: Tear down test environment
        if: always()
        run: docker compose down -v

  # =========================================================================
  # ЭТАП 4: Автоматическое развертывание в тестовую среду (Staging Deploy)
  # =========================================================================
  deploy-staging:
    name: "4. Deploy to Test Environment (Staging)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy MedBook Stack to Staging Environment
        run: |
          docker compose up -d --build
          sleep 5
          docker compose ps

      - name: Run Post-Deployment Smoke Checks (Health, Swagger, MD3 UI, Mock Gateway)
        run: |
          echo "=== 1. Checking /health endpoint ==="
          curl -fsS http://localhost:8000/health | tee staging-health.json
          echo ""
          echo "=== 2. Checking OpenAPI / Swagger UI (/docs) ==="
          curl -fsS -I http://localhost:8000/docs | head -n 5
          echo "=== 3. Checking Material Design 3 Web UI (/) ==="
          curl -fsS -I http://localhost:8000/ | head -n 5
          echo "=== 4. Checking Mock Gateway (/health) ==="
          curl -fsS http://localhost:8001/health
          echo ""
          echo "Staging deployment verified successfully!"

      - name: Upload Staging Deployment Log
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-status-${{ github.run_number }}
          path: staging-health.json
          retention-days: 7

      - name: Clean up staging runner
        if: always()
        run: docker compose down -v
